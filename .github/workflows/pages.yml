name: Publish cococat
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_e2e:
        description: Run the full browser regression suite
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Core browser smoke tests
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.full_e2e }}
        run: npm run test:e2e:smoke
      - name: Full browser regression (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_e2e }}
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
