<!doctype html><html><meta charset="utf-8"><style>html,body{margin:0;background:#f5eee4}canvas{display:block;width:100vw;height:100vh}</style><canvas id="pet"></canvas><script type="module">

renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.outputColorSpace=THREE.SRGBColorSpace;
